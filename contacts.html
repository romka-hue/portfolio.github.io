<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styleforcontact.css">
</head>
<body id="body_contacts">
    <nav id="nav_bar">
        <div class="nav-brand">
            <a href="index.html#hero_section">MySite</a>
        </div>
        <div class="nav-links">
            <a href="index.html#hero_section">Home</a>
            <a href="index.html#projects_section">Projects</a>
            <a href="contacts.html">Contact</a>
        </div>
    </nav>

    <main class="contact-page-container">
        <div class="contact-layout">
            <div class="contact-info">
                <div class="photo-placeholder">
                </div>
                <div>
                <a href="https://www.instagram.com/by_roman_nrg/" target="_blank">
                    <img src="source/instagramicon.svg" alt="Instagram" width="30" height="30">
                </a>
                </div>
            </div>
            <div class="contact-form-section">
                <h2>Get in Touch</h2>
                <p>I'm always open to discussing new projects, creative ideas, or opportunities to be part of your visions.</p>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="submit-button">Send Message</button>
                </form>
                
                
            </div>

            
        </div>
        
    </main>

    <script src="script.js"></script>
</body>
</html>
